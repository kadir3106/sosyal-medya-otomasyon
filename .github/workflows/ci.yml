name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video-worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # ffmpeg/ffprobe are preinstalled on ubuntu-latest; app/audio_bgm.py shells out to them.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # No .env is present here, which is the point: tests/conftest.py keeps the suite
      # hermetic (legacy pipeline mode, stubbed refine_script). Verified 608 passed.
      - name: Run tests
        run: pytest tests -q
