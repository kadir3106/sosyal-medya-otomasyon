name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video-worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # ffmpeg/ffprobe are NOT on the ubuntu-latest image: the first real CI run
      # failed 15 tests with FileNotFoundError: 'ffmpeg'. The earlier comment here
      # claimed they were preinstalled — that was wrong, and it only showed up
      # once CI actually ran. app/audio_bgm.py, app/render.py and
      # app/publish_quality.py all shell out to them.
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # No .env is present here, which is the point: tests/conftest.py keeps the suite
      # hermetic (legacy pipeline mode, stubbed refine_script, external network blocked,
      # retries disabled). Verified 668 passed, 3 skipped in ~55 s.
      - name: Run tests
        run: pytest tests -q

  secret-scan:
    # Izlenen dosyalarda sır deseni arar. Yerelde 385 dosyada temiz ölçüldü.
    # Job'u ayrı tutuyoruz: testler kırılsa da sızıntı kontrolü her zaman koşsun.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Scan tracked files for secrets
        run: python scripts/secret_scan.py .
