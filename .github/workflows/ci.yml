name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video-worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # ffmpeg/ffprobe are NOT on the ubuntu-latest image: the first real CI run
      # failed 15 tests with FileNotFoundError: 'ffmpeg'. The earlier comment here
      # claimed they were preinstalled — that was wrong, and it only showed up
      # once CI actually ran. app/audio_bgm.py, app/render.py and
      # app/publish_quality.py all shell out to them.
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-verify.txt

      # No .env is present here, which is the point: tests/conftest.py keeps the suite
      # hermetic (legacy pipeline mode, stubbed refine_script, external network blocked,
      # retries disabled). Re-measured 2026-11-02: 822 passed, 3 skipped, ~1 m 00 s.
      #
      # Skip sayısı NEDEN kontrol ediliyor: `cryptography`/`bcrypt` ana
      # `requirements.txt`'te yok (uygulama onları import etmiyor), bu yüzden
      # `verify_leak_rotation` testleri `importorskip` ile CI'da sessizce
      # atlanıyordu — ölçüldü: 7 passed, 4 skipped. Yani sır çözme yolunun hiç
      # çalışmadığı bir CI'da "testler yeşil" görüntüsü alınıyordu. Artık
      # `requirements-verify.txt` kuruluyor ve atlama 3'e düştü.
      #
      # 3 skip meşru ve kalıcı (conftest.py'nin kasıtlı olarak blokladığı
      # ağ/isteğe bağlı yollar). Fazlası = bir bağımlılık kayboldu = kırmızı.
      - name: Run tests
        run: |
          pytest tests -q -rs --no-header > pytest_out.txt 2>&1; status=$?
          tail -6 pytest_out.txt
          # Kapi Python ile: grep/locale'e bagimli degil.
          # KRITIK: ozet satiri HIC okunamazsa kapi YESIL olmamali. Aksi halde
          # cikti formati degistiginde (veya dosya UTF-16 yazildiginda — Windows'ta
          # `>` tam bunu yapiyor, olculdu) kapi sessizce acilir ve 4 test yeniden
          # atlanmaya baslar, kimse fark etmez.
          python - <<'PY'
          import re, sys
          raw = open("pytest_out.txt", "rb").read()
          text = ""
          for enc in ("utf-8", "utf-16", "latin-1"):
              try:
                  text = raw.decode(enc)
                  if "passed" in text or "skipped" in text:
                      break
              except (UnicodeDecodeError, UnicodeError):
                  continue
          found = re.findall(r"(\d+) skipped", text)
          passed = re.search(r"(\d+) passed", text)
          if not found and not passed:
              print("::error::pytest ozet satiri okunamadi — kapi koru, yesil sayilmiyor")
              sys.exit(1)
          skipped = int(found[-1]) if found else 0
          print("atlanan test: %d (beklenen: 3)" % skipped)
          if skipped > 3:
              for line in text.splitlines():
                  if line.startswith("SKIPPED"):
                      print(line)
              print("::error::%d test atlandi — requirements-verify.txt kurulu mu?" % skipped)
              sys.exit(1)
          PY
          exit $status

  lint:
    # Neden var: bu depoda iki çökme CI'dan geçti çünkü hiçbir lint kapısı yoktu.
    # Yalnızca `ruff` KURULU olduğu için elle fark edilmişlerdi:
    #   - scripts/daily_autonomous_agent.py: `execute_daily_run(director_mode=...)`
    #     çağrısı, imzada olmayan argüman -> TypeError. `--director` HİÇ çalışmadı.
    #   - app/telegram_bot.py: tanımsız `pending_path` -> "yeni video yap" NameError.
    # Seçilen kurallar bilinçli olarak dar: yalnızca "bu kod çalışmaz" sınıfı
    # (E9 sözdizimi/IO, F63/F7 karşılaştırma hataları, F82 tanımsız isim).
    # `tests/` de kapsanıyor: yeni eklenen bir test dosyası kullanılmayan import
    # yüzünden bu turda F401 verdi — testler de kod, onlar da kapıdan geçmeli.
    # Stil kuralları (E501, I001...) eklenmedi — 1000+ mevcut ihlal kapıyı
    # susturur ve gerçek hatayı gizler. `--isolated`: geliştiricinin makinesindeki
    # ruff.toml sonucu değiştirmesin, aksi halde "yerelde geçti, CI'da kaldı" olur.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install ruff==0.16.5

      - name: Check for undefined names and syntax errors
        run: ruff check video-worker/app video-worker/tests scripts --isolated --select E9,F63,F7,F82

  secret-scan:
    # Tarama İZLENEN + izlenmeyen (ignore'lu olmayan) dosyaları kapsıyor:
    # `git ls-files --cached --others --exclude-standard`. Yalnızca `ls-files`
    # kullanıldığında yeni yazılmış bir dosyadaki sır commit edilene kadar
    # görünmüyordu (koşu 41239608134'te `test` de bu yüzden düştü).
    # Yerelde 764 dosyada 0.87 s ölçüldü.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Scan tracked files for secrets
        run: python scripts/secret_scan.py .

  history-scan:
    # Neden ayrı job: `secret-scan` yalnızca `git ls-files` (çalışma ağacı) bakar.
    # Ölçülen kör nokta: `video-output/tiktok_session/` altında 1015 dosya
    # (Cookies, Login Data, Local State) git GEÇMİŞİNDE duruyordu ve tarayıcı
    # "Temiz: 394 dosyada sır deseni bulunamadı" diyordu. Bir kez commit'lenen
    # sır, dosya silinse bile geçmişte kalır (uçtan uca doğrulandı).
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 ZORUNLU. Varsayılan checkout shallow'dır (derinlik 1):
      # tarama yalnızca son commit'i görür ve her zaman "temiz" derdi — yani
      # geçmiş taraması hiçbir şey taramaz. Bu, düzeltilen körlüğün aynısıdır.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Scan git history for secrets and session files
        run: python scripts/secret_scan.py --history
